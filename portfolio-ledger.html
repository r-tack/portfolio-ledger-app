<!-- Portfolio Ledger: a personal investment tracker that runs as a claude.ai artifact.
     See README.md for how to publish your own copy and how to adapt the Excel import. -->
<title>Portfolio Ledger</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sticky header with three page tabs; one 1180px column; details open in a full-height side sheet (full screen on phones). */
:root {
  --plane: #f1f3f6; --surface: #ffffff; --surface-2: #f4f5f7; --surface-3: #ebedf1; --ink: #111925; --ink-2: #4a5466; --muted: #78839a;
  --line: #e3e6eb; --line-2: #cbd2dc; --accent: #1d4fc4; --accent-ink: #ffffff; --accent-wash: #e7edfb;
  --up: #08743b; --down: #c0392b; --up-wash: #e4f3e9; --down-wash: #fbe8e5; --warn-wash: #fff4dc; --warn-ink: #7a5300;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --cash: #a9b2bf; --expected: #86b6ef; --bar: #4a5466; --shadow: 0 1px 2px rgba(17,25,37,.05), 0 4px 16px rgba(17,25,37,.05);
  --scrim: rgba(12,16,22,.42);
  --font-display: "Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --plane: #0c1016; --surface: #151a22; --surface-2: #1b212b; --surface-3: #232a35; --ink: #e8ecf2; --ink-2: #aab3c1; --muted: #7c879a;
    --line: #252c37; --line-2: #343d4b; --accent: #84a7f2; --accent-ink: #0c1016; --accent-wash: #1b2640;
    --up: #3fcf80; --down: #ff7d70; --up-wash: #122a1c; --down-wash: #2e1714; --warn-wash: #2c2410; --warn-ink: #f0c25a;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --cash: #5c6675; --expected: #184f95; --bar: #aab3c1; --shadow: none; --scrim: rgba(0,0,0,.6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --plane: #0c1016; --surface: #151a22; --surface-2: #1b212b; --surface-3: #232a35; --ink: #e8ecf2; --ink-2: #aab3c1; --muted: #7c879a;
  --line: #252c37; --line-2: #343d4b; --accent: #84a7f2; --accent-ink: #0c1016; --accent-wash: #1b2640;
  --up: #3fcf80; --down: #ff7d70; --up-wash: #122a1c; --down-wash: #2e1714; --warn-wash: #2c2410; --warn-ink: #f0c25a;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --cash: #5c6675; --expected: #184f95; --bar: #aab3c1; --shadow: none; --scrim: rgba(0,0,0,.6); color-scheme: dark;
}
html { -webkit-text-size-adjust: 100%; }
body { background: var(--plane); color: var(--ink); font: 14px/1.5 var(--font-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
*, *::before, *::after { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; white-space: nowrap; }
.tnum { font-variant-numeric: tabular-nums; white-space: nowrap; }
.muted { color: var(--muted); } .ink2 { color: var(--ink-2); }
.up { color: var(--up); } .down { color: var(--down); }
.small { font-size: 12px; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }

/* header */
.appbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.appbar .wrap { display: flex; align-items: center; gap: 20px; min-height: 56px; flex-wrap: wrap; padding-block: 6px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 18px; letter-spacing: -0.01em; }
.brand-mark { width: 26px; height: 26px; border-radius: 7px; background: var(--ink); display: grid; place-items: center; }
.tabs { display: flex; gap: 2px; flex: 1 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.tab { border: 0; background: none; padding: 8px 12px; border-radius: 8px; color: var(--ink-2); font-weight: 500; white-space: nowrap; position: relative; }
.tab:hover { background: var(--surface-2); color: var(--ink); }
.tab[aria-current="page"] { color: var(--ink); }
.tab[aria-current="page"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -7px; height: 2px; background: var(--accent); border-radius: 2px; }
.asof { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--up); flex: none; }
.dot.stale { background: #e0a000; }
.hdr-end { display: flex; align-items: center; gap: 12px; margin-left: auto; flex: none; }
.privbtn { flex: none; border: 1px solid var(--line-2); background: var(--surface); width: 36px; height: 36px; border-radius: 10px; display: inline-grid; place-items: center; color: var(--ink-2); padding: 0; transition: background-color .25s, color .25s, border-color .25s; }
.privbtn:hover { background: var(--surface-2); color: var(--ink); }
.privbtn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.privbtn svg { display: block; }
/* private mode: every amount sits in .amt; it blurs smoothly, then its digits are swapped for a constant mask */
.amt { display: inline-block; transition: filter .45s cubic-bezier(.4, 0, .2, 1); }
html[data-private] .amt { filter: blur(.36em); user-select: none; -webkit-user-select: none; }
html[data-private] svg text.amt, html.pv-fade svg text.amt { filter: url(#pv-blur); transition: none; }

main { padding-block: 24px 64px; }
.view { display: grid; gap: 20px; }
.page-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.page-head h1 { font-family: var(--font-display); font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
.page-head p { margin: 4px 0 0; color: var(--ink-2); max-width: 70ch; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 20px; min-width: 0; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.panel-head h2 { font-size: 15px; font-weight: 600; }

/* KPI row */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); }
.kpi { background: var(--surface); padding: 16px 18px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.kpi .label { font-size: 12px; color: var(--ink-2); }
.kpi .value { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; }
.kpi .sub { font-size: 12px; color: var(--muted); }
.kpi.hero .value { font-size: 34px; }
@media (min-width: 900px) { .kpi.hero { grid-column: span 2; } }

.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 2px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 5px 10px; border-radius: 7px; font-size: 13px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line-2); font-weight: 500; }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); }

/* allocation */
.alloc { display: grid; grid-template-columns: minmax(220px, 280px) 1fr; gap: 28px; align-items: center; }
@media (max-width: 720px) { .alloc { grid-template-columns: 1fr; justify-items: center; } }
.donut { width: 100%; max-width: 280px; aspect-ratio: 1; position: relative; }
.donut svg { width: 100%; height: 100%; display: block; overflow: visible; }
.donut-center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; padding: 22%; }
.donut-center .k { font-size: 12px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; }
.donut-center .v { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
.legend { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; width: 100%; min-width: 0; }
.legend li { display: grid; grid-template-columns: 12px minmax(0,1fr) auto auto; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 8px; }
.legend li:hover, .legend li.hot { background: var(--surface-2); }
.legend .sw { width: 12px; height: 12px; border-radius: 3px; }
.legend .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.legend .pc { font-weight: 600; text-align: right; min-width: 56px; }
.legend .eur { color: var(--ink-2); text-align: right; min-width: 96px; }

/* holdings table */
.htools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.btn { border: 1px solid var(--line-2); background: var(--surface); border-radius: 9px; padding: 7px 12px; font-size: 13.5px; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--down); }
.btn.ghost { border-color: transparent; background: none; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.tscroll { overflow-x: auto; margin: 0 -20px; padding: 0 20px; }
table.htable { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 860px; }
.htable th { font-size: 13px; font-weight: 500; color: var(--ink); text-align: left; padding: 12px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.htable th.r { text-align: right; }
.htable th .sort { border: 0; background: none; padding: 0; display: inline-flex; align-items: center; gap: 8px; font: inherit; color: inherit; }
.htable th .sort svg { color: var(--muted); }
.htable th[aria-sort="ascending"] .sort svg .u, .htable th[aria-sort="descending"] .sort svg .d { fill: var(--ink); }
.htable td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.htable tbody tr.hrow { cursor: pointer; }
.htable tbody tr.hrow:hover td, .htable tbody tr.hrow:focus-visible td { background: var(--surface-2); }
.htable tbody tr.hrow:focus-visible { outline: none; }
.htable tbody tr td:first-child { border-radius: 10px 0 0 10px; } .htable tbody tr td:last-child { border-radius: 0 10px 10px 0; }
.htable td.r { text-align: right; white-space: nowrap; }
.sec { display: flex; align-items: center; gap: 12px; min-width: 0; font-size: 15px; }
.sec .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cur { display: inline-flex; justify-content: space-between; gap: 18px; min-width: 120px; font-size: 15px; }
.cur > span:first-child { color: var(--ink); }
.strat { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; white-space: nowrap; }
.strat svg { color: var(--muted); flex: none; }
.strat.unset { color: var(--muted); font-size: 13px; }
.pctc { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; }
.wcell { display: inline-flex; align-items: center; gap: 16px; justify-content: flex-end; }
.wtrack { width: 120px; height: 4px; border-radius: 2px; background: var(--surface-3); overflow: hidden; display: block; }
.wtrack i { display: block; height: 100%; background: var(--bar); border-radius: 2px; }
.cashic { width: 36px; height: 36px; border-radius: 9px; background: var(--ink); color: var(--surface); display: grid; place-items: center; flex: none; }
@media (max-width: 720px) {
  table.htable { min-width: 0; }
  .tscroll.hs { margin: 0; padding: 0; overflow: visible; }
  .htable .opt { display: none; }
  .htable th, .htable td { padding: 10px 4px; }
  .htable th { white-space: normal; }
  .cur { display: inline; min-width: 0; }
  .cur > span:first-child { margin-right: 4px; }
  .sec { font-size: 14px; gap: 10px; }
  .sec .logo, .sec .cashic { width: 30px; height: 30px; border-radius: 8px; }
  .sec .nm { white-space: normal; overflow-wrap: anywhere; line-height: 1.25; }
  .sec .pill { display: none; }
  .pctc { font-size: 14px; gap: 3px; }
}
.wcell > .tnum { min-width: 58px; text-align: right; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 500; border: 1px solid var(--line-2); color: var(--ink-2); background: var(--surface); white-space: nowrap; vertical-align: middle; }
.pill.warn { background: var(--warn-wash); color: var(--warn-ink); border-color: transparent; }
.pill.acc { background: var(--accent-wash); color: var(--accent); border-color: transparent; }
.pill.down { background: var(--down-wash); color: var(--down); border-color: transparent; }

.logo { width: 36px; height: 36px; border-radius: 9px; background: #fff; border: 1px solid var(--line); display: grid; place-items: center; overflow: hidden; flex: none; }
.logo img { width: 74%; height: 74%; object-fit: contain; }
.logo.mono { background: var(--accent-wash); color: var(--accent); font-weight: 700; font-family: var(--font-display); font-size: 15px; }
.spark { display: block; max-width: 100%; height: auto; }

/* folder */
details.folder { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
details.folder > summary { list-style: none; display: flex; align-items: center; gap: 12px; padding: 14px 18px; cursor: pointer; border-radius: var(--r); }
details.folder > summary::-webkit-details-marker { display: none; }
details.folder > summary:hover { background: var(--surface-2); }
.folder-ic { width: 34px; height: 28px; flex: none; color: var(--ink-2); }
.folder-title { font-weight: 600; }
.folder-meta { color: var(--ink-2); font-size: 13px; margin-left: auto; text-align: right; }
.chev { transition: transform .2s; color: var(--muted); flex: none; }
details[open] > summary .chev { transform: rotate(90deg); }
.folder-body { border-top: 1px solid var(--line); padding: 16px 18px 18px; display: grid; gap: 14px; }
.closed-card { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 20px; padding: 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
@media (max-width: 760px) { .closed-card { grid-template-columns: 1fr; } }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px 16px; margin-top: 12px; }
.fact .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.fact .v { font-weight: 600; }
.callout { margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; color: var(--ink-2); }
.callout strong { color: var(--ink); }
.ident { display: flex; align-items: center; gap: 12px; min-width: 0; }
.ident .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ident .tk { font-size: 12px; color: var(--muted); }
.ident > div { min-width: 0; }

/* side sheet */
[hidden]:not([hidden=until-found i]) { display: none !important; }
.backdrop { position: fixed; inset: 0; z-index: 40; background: var(--scrim); display: flex; justify-content: flex-end; }
.sheet { background: var(--surface); width: min(620px, 100%); height: 100%; max-height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; box-shadow: -16px 0 48px rgba(0,0,0,.18);
  padding: calc(24px + env(safe-area-inset-top, 0px)) max(28px, env(safe-area-inset-right, 0px)) calc(96px + env(safe-area-inset-bottom, 0px)) 28px; animation: slidein .2s ease-out; }
@keyframes slidein { from { transform: translateX(24px); opacity: .6; } }
@media (max-width: 640px) { .sheet { width: 100%; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); } }
.sheet-head { display: flex; gap: 18px; align-items: flex-start; }
.sheet-head .logo { width: 64px; height: 64px; border-radius: 14px; }
.sheet-head .logo.mono { font-size: 26px; }
.sheet-head .cashic { width: 64px; height: 64px; border-radius: 14px; }
.sheet-title { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; overflow-wrap: anywhere; }
.sheet-sub { color: var(--ink-2); font-size: 15px; display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 4px; letter-spacing: .02em; }
.sheet-sub .sep { color: var(--line-2); }
.closebtn { margin-left: auto; flex: none; width: 44px; height: 44px; border-radius: 50%; background: var(--surface-3); border: 0; display: grid; place-items: center; color: var(--ink); }
.closebtn:hover { background: var(--line-2); }
.sheet-tabs { display: flex; gap: 28px; border-bottom: 1px solid var(--line); margin: 26px -28px 0; padding: 0 28px; overflow-x: auto; scrollbar-width: none; }
@media (max-width: 640px) { .sheet-tabs { margin: 22px -16px 0; padding: 0 16px; gap: 22px; } }
.sheet-tab { border: 0; background: none; padding: 12px 0; font-size: 16px; color: var(--ink-2); border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.sheet-tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 500; }
.tagbar { display: flex; flex-wrap: wrap; gap: 10px 24px; padding: 14px 18px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; margin-top: 24px; }
.tag { display: inline-flex; align-items: center; gap: 9px; color: var(--ink-2); font-size: 15px; border: 0; background: none; padding: 0; }
.tag svg { color: var(--muted); flex: none; }
button.tag { border-bottom: 1px dashed transparent; }
button.tag:hover { color: var(--ink); border-bottom-color: var(--muted); }
.ssec { margin-top: 30px; }
.ssec > h3 { font-size: 16px; font-weight: 600; padding-bottom: 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.kvrow { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--line); font-size: 16px; }
.kvrow .k { min-width: 0; }
.kvrow .k small { display: block; color: var(--ink-2); font-size: 13px; margin-top: 2px; }
.kvrow .v { text-align: right; font-variant-numeric: tabular-nums; }
.kvrow .v small { display: block; font-size: 13px; color: var(--ink-2); }
.dotted { border-bottom: 1px dashed var(--muted); cursor: help; }
.bigamt { font-size: 34px; font-weight: 600; letter-spacing: -0.02em; margin-top: 18px; }
.sheet-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 26px; }
details.raw { margin-top: 26px; border: 1px solid var(--line); border-radius: 10px; }
details.raw > summary { cursor: pointer; padding: 12px 14px; font-weight: 500; }
details.raw .rawbody { padding: 0 14px 14px; display: grid; gap: 16px; }
.kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; font-size: 13px; margin: 0; }
.kv dt { color: var(--ink-2); min-width: 0; overflow-wrap: anywhere; }
.kv dt small { color: var(--muted); display: block; font-size: 11px; }
.kv dd { margin: 0; text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.sub-h { font-size: 12px; font-weight: 600; color: var(--ink); margin: 0 0 8px; }

/* calendar */
.calrow { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
.caldate { width: 56px; border-radius: 10px; border: 1px solid var(--line); text-align: center; overflow: hidden; background: var(--surface); }
.caldate b { display: block; font-size: 20px; line-height: 1.6; font-weight: 600; }
.caldate span { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; background: var(--surface-2); color: var(--ink-2); padding: 1px 0; }
.calrow.past { opacity: .62; }
.caltitle { font-size: 15.5px; font-weight: 500; }
.calsub { font-size: 13px; color: var(--ink-2); }

/* transactions list */
.txmonth { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; padding: 20px 2px 6px; }
.txmonth:first-child { padding-top: 4px; }
.txrow { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 10px 2px; border-bottom: 1px solid var(--line); }
.txrow:last-child { border-bottom: 0; }

  function cleanSheet(header, body, exclude, present) {
    const ex = new Set((exclude || []).map(normCol)), keep = [], names = [], dropped = [], cleared = [];

  const safeId = s => String(s).replace(/[^A-Za-z0-9_.\-@+:]/g, ch => '~' + ch.charCodeAt(0).toString(16).toUpperCase().padStart(2, '0'));

  const COLS = {
    date: ['Transactiedatum', 'Trade date', 'Transaction date', 'Date'], valueDate: ['Valutadatum', 'Value date'],
    category: ['Transactietype', 'Transaction type'], action: ['Acties', 'Actions', 'Action', 'Event'],
    amount: ['Boekingsbedrag', 'Booked amount', 'Booking amount'], ccy: ['Valuta', 'Currency'],
    fx: ['Omrekeningskoers', 'Conversion rate', 'Exchange rate'], conv: ['Conversion cost', 'Conversiekosten'],

    exch: ['Uitwisselingsbeschrijving', 'Exchange description', 'Exchange'], tid: ['Transactie-ID', 'Transaction ID', 'Trade ID'],

    bdate: ['Boekingsdatum', 'Booking date', 'Posting date'], exDate: ['Ex-datum', 'Ex-date', 'Ex date'],

  };
  const g = (o, key) => { if (!o) return null; for (const n of COLS[key]) { const v = o[n]; if (v != null && v !== '') return v; } return null; };
  const num = v => {
    if (v == null) return null; if (typeof v === 'number') return isFinite(v) ? v : null;

    if (/etf|etc|etn/.test(s)) return 'ETF'; if (/bond/.test(s)) return 'Bonds'; if (/fund/.test(s)) return 'Investment funds';
    if (/option/.test(s)) return 'Options'; if (/future/.test(s)) return 'Futures'; if (/cfd/.test(s)) return 'CFDs'; if (/stock|share|equity/.test(s)) return 'Shares';

const pvBlur = $('#pv-blur feGaussianBlur'), PV_SD = 3.2, PV_MS = 450;
let pvSd = 0, pvAnim = 0, pvTimer = 0;
const calm = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function svgBlurTo(target, done) {

  const step = now => {
    const k = dur ? Math.min(1, (now - t0) / dur) : 1, e = k < .5 ? 2 * k * k : 1 - Math.pow(2 - 2 * k, 2) / 2;
    pvSd = from + (target - from) * e; pvBlur.setAttribute('stdDeviation', pvSd.toFixed(2));

  };

}

function sparkSVG(dates, vals, opts = {}) {
  const w = opts.w || 112, h = opts.h || 34, pad = 3;
  const pts = []; for (let i = 0; i < vals.length; i++) if (vals[i] != null) pts.push([dates[i], vals[i]]);
  if (pts.length < 2) return `<svg class="spark" width="${w}" height="${h}" aria-hidden="true"><line x1="0" x2="${w}" y1="${h / 2}" y2="${h / 2}" stroke="var(--line-2)"/></svg>`;
  const t0 = parseD(pts[0][0]).getTime(), t1 = parseD(pts[pts.length - 1][0]).getTime() || t0 + 1;
  let lo = Infinity, hi = -Infinity; for (const [, v] of pts) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
  if (hi === lo) { hi += 1; lo -= 1; }
  const X = d => pad + (parseD(d).getTime() - t0) / (t1 - t0 || 1) * (w - pad * 2), Y = v => pad + (1 - (v - lo) / (hi - lo)) * (h - pad * 2);
  const line = pts.map(([d, v], i) => (i ? 'L' : 'M') + X(d).toFixed(1) + ',' + Y(v).toFixed(1)).join('');
  const up = pts[pts.length - 1][1] >= pts[0][1], col = up ? 'var(--up)' : 'var(--down)';
  const area = line + `L${X(pts[pts.length - 1][0]).toFixed(1)},${h}L${X(pts[0][0]).toFixed(1)},${h}Z`;
  const [ld, lv] = pts[pts.length - 1];
  const mark = opts.markDate && opts.markDate >= pts[0][0] ? `<line x1="${X(opts.markDate).toFixed(1)}" x2="${X(opts.markDate).toFixed(1)}" y1="0" y2="${h}" stroke="var(--line-2)"/>` : '';

}

function pieGroups(m) {
  const key = { position: p => p.name, industry: p => p.industry, sector: p => p.sector, currency: p => p.ccy, asset: p => p.assetClass }[S.ui.pieMode];
  const map = new Map();
  for (const p of m.open) { const k = key(p) || 'Unclassified'; const o = map.get(k) || { name: k, value: 0, items: [] }; o.value += Math.max(0, p.value); o.items.push(p); map.set(k, o); }
  let arr = [...map.values()].sort((a, b) => b.value - a.value);
  if (arr.length > 7) { const rest = arr.slice(6); arr = arr.slice(0, 6).concat([{ name: 'Other', value: rest.reduce((s, x) => s + x.value, 0), items: rest.flatMap(x => x.items) }]); }
  arr.forEach((g, i) => { g.color = `var(--s${i + 1})`; });
  if (S.ui.includeCash && m.cash > 0) arr.push({ name: 'Cash', value: m.cash, items: [], color: 'var(--cash)' });
  const tot = arr.reduce((s, x) => s + x.value, 0);
  arr.forEach(g => g.share = tot ? g.value / tot : 0);
  return { arr, tot };
}
function drawDonut(m) {
  const box = $('#donut'), leg = $('#pie-legend'); if (!box) return;

  const size = 280, R = size / 2, r0 = R * 0.64;
  const pie = d3.pie().value(d => d.value).sort(null).padAngle(arr.length > 1 ? 2.2 / R : 0);
  const arc = d3.arc().innerRadius(r0).outerRadius(R).cornerRadius(3), arcHot = d3.arc().innerRadius(r0).outerRadius(R + 6).cornerRadius(3);
  const svg = d3.create('svg').attr('viewBox', `${-R - 8} ${-R - 8} ${size + 16} ${size + 16}`).attr('role', 'img').attr('aria-label', 'Allocation donut chart');
  const center = document.createElement('div'); center.className = 'donut-center';
  const setCenter = g => { center.innerHTML = g ? `<div class="k">${esc(g.name)}</div><div class="v tnum">${pct(g.share, 1)}</div><div class="k">${eur(g.value)}</div>` : `<div class="k">${S.ui.includeCash ? 'Portfolio' : 'Invested'}</div><div class="v tnum">${eur(tot, 0)}</div><div class="k">${arr.length} ${S.ui.pieMode === 'position' ? 'positions' : 'groups'}</div>`; };
  const paths = svg.append('g').selectAll('path').data(pie(arr)).join('path').attr('d', arc).attr('fill', d => d.data.color)
    .attr('tabindex', 0).attr('role', 'img').attr('aria-label', d => `${d.data.name}: ${pct(d.data.share)} (${eurT(d.data.value)})`).style('outline', 'none');
  const hot = (d, on) => { paths.attr('d', x => (on && x === d) ? arcHot(x) : arc(x)).attr('opacity', x => on && x !== d ? 0.45 : 1); setCenter(on ? d.data : null); $$('li', leg).forEach((li, i) => li.classList.toggle('hot', on && i === d.index)); };
  paths.on('pointerenter focus', (e, d) => hot(d, true)).on('pointerleave blur', (e, d) => hot(d, false));
  box.replaceChildren(svg.node(), center); setCenter(null);
  leg.innerHTML = arr.map(g => `<li><span class="sw" style="background:${g.color}"></span><span class="nm" title="${esc(g.items.map(p => p.name).join(', '))}">${esc(g.name)}${g.items.length > 1 && S.ui.pieMode !== 'position' ? ` <span class="muted small">· ${g.items.length}</span>` : ''}</span><span class="pc tnum">${pct(g.share, 1)}</span><span class="eur tnum">${eur(g.value)}</span></li>`).join('');
  $$('li', leg).forEach((li, i) => { li.onpointerenter = () => hot(paths.data()[i], true); li.onpointerleave = () => hot(paths.data()[i], false); });
}

const curCell = (v, signed) => `<span class="cur"><span>€</span><span class="tnum">${signed ? neg(v, 2) : ''}${ok(v) ? amt(dig(v, 2)) : '—'}</span></span>`;
const pctCell = v => `<span class="pctc ${cls(v)}">${v > 0.00005 ? IC.upArrow : v < -0.00005 ? IC.downArrow : ''}<span class="tnum">${pct(v, 2)}</span></span>`;
const weightCell = w => `<span class="wcell"><span class="wtrack" aria-hidden="true"><i style="width:${Math.max(0, Math.min(100, w * 100)).toFixed(1)}%"></i></span><span class="tnum">${pct(w, 2)}</span></span>`;
const stratCell = s => s ? `<span class="strat">${STRATS[s] || STRATS.Index}${esc(s)}</span>` : `<span class="strat unset">Not set</span>`;
function renderHoldings(m) {
  const box = $('#holdings'); if (!box) return;
  const cols = HCOLS.filter(c => S.ui.cols.has(c.k));
  const { k: sk, dir } = S.ui.sort, f = dir === 'asc' ? 1 : -1;
  const sorter = sk === 'security' ? (a, b) => f * a.name.localeCompare(b.name) : (() => { const c = HCOLS.find(x => x.k === sk) || HCOLS[4]; return (a, b) => { const x = c.val(a), y = c.val(b); return typeof x === 'string' ? f * x.localeCompare(y) : f * (x - y); }; })();
  const rows = m.open.slice().sort(sorter);

      case 'shares': return `<td class="r${o} tnum">${isCash ? '' : qtyFmt(p.qty) + (p.mult > 1 ? ` <span class="muted">× ${p.mult}</span>` : '')}</td>`;
      case 'avg': return `<td class="r${o} tnum">${isCash ? '' : money(p.avg, p.ccy)}</td>`;
      case 'worth': return `<td class="r">${curCell(isCash ? m.cash : p.value)}</td>`;
      case 'pl': return `<td class="r${o}">${curCell(isCash ? 0 : p.ret, true)}</td>`;
      case 'pct': return `<td class="r">${pctCell(isCash ? 0 : p.retPct)}</td>`;
      case 'spark': { if (isCash) return `<td class="r${o}"></td>`; const ly = lastYear(p.series, m.asOf); return `<td class="r${o}">${sparkSVG(ly.dates, ly.vals, { markDate: p.openDate, label: `${p.name}, price over the last year` })}</td>`; }

  box.innerHTML = `<table class="htable"><thead><tr>${th('security', 'Security')}${cols.map(c => th(c.k, c.l, c.r)).join('')}</tr></thead><tbody>${cashRow}${rows.map(posRow).join('')}</tbody></table>`;
  $$('[data-sort]', box).forEach(b => b.onclick = () => { const k = b.dataset.sort; S.ui.sort = { k, dir: S.ui.sort.k === k && S.ui.sort.dir === 'desc' ? 'asc' : 'desc' }; store.set('sort', S.ui.sort); renderHoldings(m); });
  $$('tr.hrow', box).forEach(tr => { const o = () => openSheet({ type: 'position', key: tr.dataset.pos, tab: 'overview' }); tr.onclick = o; tr.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); o(); } }; });

/* ---------- small line chart ---------- */
function miniLine(el, { dates, vals, ccy, band, marks, refs, height = 170 }) {
  const w = Math.max(240, el.clientWidth || 300), h = height, mg = { l: 48, r: 10, t: 10, b: 22 };
  const pts = dates.map((d, i) => [parseD(d), vals[i]]).filter(x => x[1] != null);
  if (pts.length < 2) { el.innerHTML = '<p class="small muted">Not enough price history to draw.</p>'; return; }
  const x = d3.scaleUtc().domain(d3.extent(pts, p => p[0])).range([mg.l, w - mg.r]);
  const ext = d3.extent(pts.map(p => p[1]).concat((refs || []).map(r => r.v)).concat((marks || []).map(r => r.v)));
  const pad = (ext[1] - ext[0]) * 0.08 || 1;
  const y = d3.scaleLinear().domain([ext[0] - pad, ext[1] + pad]).nice(4).range([h - mg.b, mg.t]);
  const svg = d3.create('svg').attr('viewBox', `0 0 ${w} ${h}`).attr('height', h).attr('role', 'img').attr('aria-label', 'Price chart');
  svg.append('g').attr('class', 'grid').selectAll('line').data(y.ticks(4)).join('line').attr('x1', mg.l).attr('x2', w - mg.r).attr('y1', y).attr('y2', y);
  svg.append('g').attr('class', 'axis').selectAll('text').data(y.ticks(4)).join('text').attr('x', mg.l - 6).attr('y', d => y(d) + 4).attr('text-anchor', 'end').attr('class', 'amt').text(d => PV.mask ? MASK(0) : sig4.format(d));
  svg.append('g').attr('class', 'axis').selectAll('text').data(x.ticks(Math.max(2, Math.floor(w / 110)))).join('text').attr('x', x).attr('y', h - 4).attr('text-anchor', 'middle').text(d3.utcFormat('%b %y'));
  if (band) { const b0 = Math.max(x(parseD(band[0])), mg.l); svg.append('rect').attr('x', b0).attr('width', Math.max(2, x(parseD(band[1])) - b0)).attr('y', mg.t).attr('height', h - mg.b - mg.t).attr('fill', 'var(--s1)').attr('opacity', 0.1); }
  for (const r of refs || []) svg.append('line').attr('x1', mg.l).attr('x2', w - mg.r).attr('y1', y(r.v)).attr('y2', y(r.v)).attr('stroke', r.color || 'var(--muted)').attr('stroke-width', 1.2).attr('stroke-dasharray', '4 4');
  svg.append('path').attr('d', d3.line().x(p => x(p[0])).y(p => y(p[1]))(pts)).attr('fill', 'none').attr('stroke', 'var(--s1)').attr('stroke-width', 2).attr('stroke-linejoin', 'round');
  for (const mk of marks || []) if (parseD(mk.d) >= pts[0][0]) svg.append('circle').attr('cx', x(parseD(mk.d))).attr('cy', y(mk.v)).attr('r', 4.5).attr('fill', mk.color || 'var(--s2)').attr('stroke', 'var(--surface)').attr('stroke-width', 2);
  const end = pts[pts.length - 1];
  svg.append('circle').attr('cx', x(end[0])).attr('cy', y(end[1])).attr('r', 4).attr('fill', 'var(--s1)').attr('stroke', 'var(--surface)').attr('stroke-width', 2);
  const cross = svg.append('line').attr('y1', mg.t).attr('y2', h - mg.b).attr('stroke', 'var(--line-2)').attr('opacity', 0);
  const bis = d3.bisector(p => p[0]).center;
  svg.append('rect').attr('x', mg.l).attr('y', 0).attr('width', w - mg.l - mg.r).attr('height', h).attr('fill', 'transparent')
    .on('pointermove', e => { const [mx] = d3.pointer(e); const p = pts[bis(pts, x.invert(mx))]; cross.attr('x1', x(p[0])).attr('x2', x(p[0])).attr('opacity', 1);
      showTip(`<div class="t-h">${esc(dfmt(p[0].toISOString()))}</div><div class="t-r"><i style="background:var(--s1)"></i><span>Close</span><b>${money(p[1], ccy)}</b></div>`, e.clientX, e.clientY); })
    .on('pointerleave', () => { cross.attr('opacity', 0); hideTip(); });
  el.replaceChildren(svg.node());
}
function drawClosedChart(el, m) {
  if (!el.isConnected || el.offsetParent === null) return;
  const p = m.closed.find(x => x.symbol === el.dataset.cchart); if (!p) return;
  const deriv = /option|future/i.test(p.assetClass) && p.underlying;
  const s = deriv ? p.underlying.series : p.series; if (!s) { el.innerHTML = ''; return; }
  const sl = sliceFrom(s, C.addDays(p.openDate, -60));
  miniLine(el, { dates: sl.dates, vals: sl.vals, ccy: deriv ? 'USD' : p.ccy, band: [p.openDate, p.closeDate], marks: [{ d: p.closeDate, v: deriv ? m.at(s, p.closeDate) : p.avgSell }], refs: deriv && p.underlying.strike ? [{ v: p.underlying.strike }] : [] });
}

/* ===================== SHEET ===================== */
let lastFocus = null;
function openSheet(state) { if (PV.on && state.type !== 'position') return; if (!S.ui.sheet) lastFocus = document.activeElement; S.ui.sheet = state; closePop(); renderSheet(true); }
function closeSheet(silent) {
  if (!S.ui.sheet) return; S.ui.sheet = null; closePop();
  const root = $('#sheet-root'); root.hidden = true; root.innerHTML = ''; document.documentElement.style.overflow = '';
  if (!silent && lastFocus && lastFocus.isConnected) lastFocus.focus({ preventScroll: true });
}
function renderSheet(fresh) {
  const st = S.ui.sheet, root = $('#sheet-root'); if (!st) return;
  const m = getModel();
  let html = '';
  if (st.type === 'position') { const p = findPos(st.key); if (!p) { closeSheet(); return; } html = positionSheetHTML(p, m, st.tab); }
  else if (st.type === 'tx') { const e = evByKey(st.key); if (!e) { closeSheet(); return; } html = txSheetHTML(e, m); }
  else if (st.type === 'edit') { const e = evByKey(st.key); if (!e) { closeSheet(); return; } html = editSheetHTML(e); }
  const prev = $('.sheet', root), scroll = prev && !fresh ? prev.scrollTop : 0;
  if (st.type === 'edit' && !fresh && prev) return; // keep form state while editing
  root.innerHTML = `<aside class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">${html}</aside>`;
  root.hidden = false; document.documentElement.style.overflow = 'hidden';
  const sheet = $('.sheet', root); sheet.scrollTop = scroll;
  root.onpointerdown = e => { if (e.target === root) closeSheet(); };

function bindEditSheet(sheet) {
  const key = S.ui.sheet.key, e = evByKey(key), o = e.orig || { date: e.date, kind: e.kind, qty: e.qty, price: e.price, amount: e.amount, cost: e.cost };

  const sync = () => { trade.hidden = !['buy', 'sell'].includes(kindSel.value); }; sync(); kindSel.onchange = sync;
  $('[data-cancel]', sheet).onclick = () => openSheet({ type: 'tx', key });
  const undo = $('[data-undo]', sheet); if (undo) undo.onclick = () => { saveEdit(key, e.hidden ? { hidden: true, fields: {} } : null, 'Your edits were undone.'); openSheet({ type: 'tx', key }); };
  $('#edit-form', sheet).onsubmit = ev => {
    ev.preventDefault();
    const err = $('#ef-err', sheet), numv = id => { const s = $(id, sheet).value.trim(); return s === '' ? null : Number(s); };
    const date = $('#ef-date', sheet).value, kind = kindSel.value, isTrade = kind === 'buy' || kind === 'sell';
    const qty = numv('#ef-qty'), price = numv('#ef-price'), amount = numv('#ef-amount'), cost = numv('#ef-cost'), note = $('#ef-note', sheet).value.trim();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { err.textContent = 'Enter a valid date.'; return; }
    if ([qty, price, amount, cost].some(x => x != null && !isFinite(x))) { err.textContent = 'Numbers can only contain digits, a minus sign and a decimal point.'; return; }
    if (isTrade && !(qty > 0)) { err.textContent = 'A buy or sell needs a quantity above zero.'; return; }
    if (isTrade && (price == null || !(price >= 0))) { err.textContent = 'A buy or sell needs a price.'; return; }

    if (kind !== o.kind) f.kind = kind;
    if (isTrade && diff(qty, o.qty != null ? Math.abs(o.qty) : null)) f.qty = qty;
    if (isTrade && diff(price, o.price)) f.price = price;
    if (diff(amount, o.amount)) f.amount = amount;
    if (diff(cost, o.cost)) f.cost = cost;
    if (note) f.note = note;

    openSheet({ type: 'tx', key });

}

      <div class="colchips never">${list.length ? list.map(c => `<span class="pill">${esc(c)}${S.readOnly ? '' : `<button class="chipx" data-unexcl="${esc(role)}" data-col="${esc(c)}" aria-label="Import ${esc(c)} again from future files">×</button>`}</span>`).join('') : '<span class="small muted">None</span>'}</div>
      ${S.readOnly || !avail.length ? '' : `<div class="manage-add" style="margin-top:8px"><select data-exsel="${esc(role)}" aria-label="Column to stop importing"><option value="">Never import another column…</option>${avail.map(c => `<option value="${esc(c)}">${esc(COL_EN[c] && COL_EN[c] !== c ? `${c} (${COL_EN[c]})` : c)}</option>`).join('')}</select><button class="btn" data-exadd="${esc(role)}">Never import</button></div>`}</div>`;
  }).join('');
  return `<section class="panel"><details class="imports" ${store.get('impOpen', false) ? 'open' : ''} id="imp-details"><summary><span>Imports & columns</span><span class="small muted" style="font-weight:400">${imps.length} file${imps.length === 1 ? '' : 's'} · ${total} column${total === 1 ? '' : 's'} never imported ${IC.chev}</span></summary>
    <div style="display:grid;gap:16px;margin-top:14px">
    <div class="drop" id="drop"><p><b>Drop a newer .xlsx export here.</b> The file is only opened in your browser. Columns you blanked out, and every column on the never-import list, are cut before anything is saved, even when a file has data in them. Overlapping dates replace the older import.</p></div>
    <div id="imp-status" class="small ink2" role="status"></div>
    <div style="border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px">
      <div><h3 class="sub-h" style="margin:0">Never imported</h3><p class="small muted" style="margin:2px 0 0">A column you leave blank in an export is added here automatically. Columns that the broker itself leaves empty are kept.</p></div>
      ${never}
    </div>
    ${imps.map(i => {
      const d = i.dropped || {}, n = Object.values(d).reduce((s, a) => s + a.length, 0);
      return `<div style="border:1px solid var(--line);border-radius:10px;padding:12px 14px">
      <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center"><div><b>${esc(i.fileName || 'Import')}</b><div class="small muted">${i.period ? `Covers ${esc(dfmt(i.period.from))} – ${esc(dfmt(i.period.to))} · ` : ''}imported ${esc(dfmt(i.importedAt))} · ${n} column${n === 1 ? '' : 's'} not imported${i.complete ? '' : ' · <span class="pill warn">incomplete upload</span>'}</div></div>
      ${S.readOnly ? '' : `<button class="btn danger" data-delimp="${esc(i.id)}">Remove</button>`}</div>
      ${Object.entries(i.sheets || {}).map(([name, sh]) => `<div style="margin-top:10px"><div class="small" style="margin-bottom:6px"><b>${esc(name)}</b> <span class="muted">· ${sh.columns.length} of ${(i.columnCounts && i.columnCounts[name]) || sh.columns.length} columns kept</span></div>
        <div class="colchips">${(d[name] || []).map(c => `<span class="pill" title="Not imported">${esc(c)}</span>`).join('')}</div></div>`).join('')}
    </div>`;
    }).join('')}</div></details></section>`;
}
function saveColumns(role, col, add, quiet) {
  const ex = JSON.parse(JSON.stringify((S.columns && S.columns.exclude) || {}));
  const list = new Set(ex[role] || []); if (add) list.add(col); else list.delete(col); ex[role] = [...list];
  S.columns = { exclude: ex }; scheduleRender();
  if (!S.db) return Promise.resolve();
  writeChain = writeChain.then(() => S.db.doc('settings/columns').set({ exclude: ex, updatedAt: new Date().toISOString() }))
    .then(() => { if (!quiet) toast(add ? `“${col}” will never be imported.` : `“${col}” will be imported again from future files.`); }).catch(writeFailed);
  return writeChain;
}
function stripColumn(role, col) {
  if (!S.db) return Promise.resolve();
  for (const d of S.imports) {
    let changed = false; const sheets = {}, dropped = Object.assign({}, d.dropped || {});
    for (const [name, sh] of Object.entries(d.sheets || {})) {
      const i = C.sheetRole(name) === role ? (sh.columns || []).indexOf(col) : -1;
      if (i < 0) { sheets[name] = sh; continue; }
      changed = true;
      sheets[name] = { columns: sh.columns.filter((_, k) => k !== i), rows: (sh.rows || []).map(r => r.filter((_, k) => k !== i)) };
      dropped[name] = [...(dropped[name] || []), col];
    }
    if (!changed) continue;
    const body = Object.assign({}, d, { sheets, dropped }); delete body.__id;
    writeChain = writeChain.then(() => S.db.doc('imports/' + d.__id).set(body)).catch(writeFailed);
  }
  return writeChain.then(() => toast(`“${col}” was also removed from your saved imports.`));
}
function bindImport(v) {
  const det = $('#imp-details', v); if (det) det.ontoggle = () => store.set('impOpen', det.open);
  const drop = $('#drop', v);
  if (drop) { drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); }; drop.ondragleave = () => drop.classList.remove('over'); drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); const f = e.dataTransfer.files[0]; if (f) importFile(f); }; }
  $$('[data-delimp]', v).forEach(b => {
    b.onclick = async () => {
      if (b.dataset.confirm !== '1') { b.dataset.confirm = '1'; b.textContent = 'Click again to remove'; setTimeout(() => { if (b.isConnected) { b.dataset.confirm = ''; b.textContent = 'Remove'; } }, 4000); return; }
      const parts = S.imports.filter(d => (d.importId || d.__id) === b.dataset.delimp);
      try { for (const p of parts) await S.db.doc('imports/' + p.__id).delete(); toast('Import removed.'); } catch (e) { writeFailed(e); }
    };
  });
  $$('[data-unexcl]', v).forEach(b => b.onclick = () => saveColumns(b.dataset.unexcl, b.dataset.col, false));
  $$('[data-exadd]', v).forEach(b => b.onclick = () => {
    const role = b.dataset.exadd, sel = $(`[data-exsel="${role}"]`, v), col = sel && sel.value;
    if (!col) { toast('Choose a column first.'); return; }
    if (b.dataset.confirm !== '1') { b.dataset.confirm = '1'; b.textContent = 'Click again: also removes it from saved imports'; return; }
    saveColumns(role, col, true).then(() => stripColumn(role, col));
  });
}
$('#imp-file').onchange = e => { const f = e.target.files[0]; if (f) importFile(f); e.target.value = ''; };
let xlsxLoading;
function loadXLSX() {
  if (window.XLSX) return Promise.resolve();
  return xlsxLoading = xlsxLoading || new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = res; s.onerror = () => { xlsxLoading = null; rej(new Error('load')); }; document.head.appendChild(s); });
}
const pad2 = n => String(n).padStart(2, '0');
/* undefined = no cell at all (a cleared cell); '' = a cell holding empty text (the broker's own blank) */
function cellValue(cell) {
  if (!cell || cell.t === 'z') return undefined;
  if (cell.t === 'e') return null;
  if (cell.t === 'n' && cell.z && XLSX.SSF.is_date(cell.z)) { const p = XLSX.SSF.parse_date_code(cell.v); if (!p) return cell.v; const d = `${p.y}-${pad2(p.m)}-${pad2(p.d)}`; return (p.H || p.M || p.S) ? `${d}T${pad2(p.H)}:${pad2(p.M)}:${pad2(Math.floor(p.S))}` : d; }
  if (cell.t === 'd' && cell.v instanceof Date) { const d = cell.v; return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
  if (cell.t === 's') return String(cell.v ?? '').trim();
  return cell.v;
}
function readWorkbook(wb, exclude) {
  const sheets = {}, dropped = {}, cleared = {}, columnCounts = {}; let minD = null, maxD = null;
  for (const name of wb.SheetNames) {
    const ws = wb.Sheets[name]; if (!ws || !ws['!ref']) continue;
    const rg = XLSX.utils.decode_range(ws['!ref']), grid = [];
    for (let R = rg.s.r; R <= rg.e.r; R++) { const row = []; for (let Cc = rg.s.c; Cc <= rg.e.c; Cc++) row.push(cellValue(ws[XLSX.utils.encode_cell({ r: R, c: Cc })])); grid.push(row); }
    if (!grid.length) continue;
    const header = grid[0].map(C.normCol), body = grid.slice(1).filter(r => !r.every(C.isBlank));
    const present = header.map((_, i) => body.some(r => r[i] !== undefined));
    const role = C.sheetRole(name), res = C.cleanSheet(header, body, (exclude && exclude[role]) || [], present);
    sheets[name] = { columns: res.columns, rows: res.rows }; dropped[name] = res.dropped; cleared[name] = res.cleared; columnCounts[name] = header.length;
    const di = res.columns.findIndex(c => C.COLS.date.includes(c));
    if (role === 'main' && di >= 0) for (const r of res.rows) { const d = C.day(r[di]); if (d) { if (!minD || d < minD) minD = d; if (!maxD || d > maxD) maxD = d; } }
  }
  return { sheets, dropped, cleared, columnCounts, minD, maxD };
}
async function importFile(file) {
  if (S.ui.route !== 'transactions') go('transactions');
  store.set('impOpen', true);
  const status = t => { const st = $('#imp-status'); if (st) st.textContent = t; else toast(t); };
  if (!S.db) { toast('Sign in on claude.ai to import.'); return; }
  if (S.readOnly) { toast('You can view this tracker but not import into it.'); return; }
  if (!/\.xlsx?$/i.test(file.name)) { status('That file is not an Excel export (.xlsx). Export your transactions from the broker as Excel and try again.'); return; }
  status('Reading ' + file.name + ' in your browser…');
  try { await loadXLSX(); } catch { status("The Excel reader couldn't be loaded. Check your connection and try again."); return; }
  let wb; try { wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellNF: true, cellDates: false }); } catch { status("This file couldn't be read as Excel. Re-export it from your broker and try again."); return; }
  const ex = (S.columns && S.columns.exclude) || {};
  const { sheets, dropped, cleared, columnCounts, minD, maxD } = readWorkbook(wb, ex);
  if (!Object.keys(sheets).some(n => C.sheetRole(n) === 'main')) { status("No transactions sheet was found in this file. Use the broker's transactions export."); return; }
  const fm = file.name.match(/(\d{4}-\d{2}-\d{2})_(\d{4}-\d{2}-\d{2})/);
  const period = fm ? { from: fm[1], to: fm[2] } : (minD ? { from: minD, to: maxD } : null);
  const importId = 'imp-' + Date.now().toString(36);
  const base = { importId, fileName: file.name, importedAt: new Date().toISOString(), period, dropped, columnCounts, via: 'page' };
  const parts = []; let cur = { sheets: {} }, size = 2000;
  for (const [name, sh] of Object.entries(sheets)) {
    cur.sheets[name] = { columns: sh.columns, rows: [] };
    for (const r of sh.rows) { const sz = JSON.stringify(r).length + 1; if (size + sz > 200000 && Object.values(cur.sheets).some(s => s.rows.length)) { parts.push(cur); cur = { sheets: { [name]: { columns: sh.columns, rows: [] } } }; size = 2000; } cur.sheets[name].rows.push(r); size += sz; }
  }
  parts.push(cur);
  const totalDropped = Object.values(dropped).reduce((s, a) => s + a.length, 0);
  status(`Saving ${file.name}… ${totalDropped} column${totalDropped === 1 ? '' : 's'} left out.`);
  try {
    for (let i = 0; i < parts.length; i++) await S.db.doc('imports/' + (i ? `${importId}-p${i + 1}` : importId)).set(Object.assign({}, base, parts[i], { part: i + 1, parts: parts.length }));
    const fresh = [];
    for (const [name, cols] of Object.entries(cleared)) { const role = C.sheetRole(name); for (const c of cols) if (!(ex[role] || []).includes(c)) fresh.push([role, c]); }
    for (const [role, c] of fresh) await saveColumns(role, c, true, true);
    status(`Imported ${file.name}. Left out ${totalDropped} column${totalDropped === 1 ? '' : 's'}: ${Object.values(dropped).flat().join(', ') || 'none'}.${fresh.length ? ` ${fresh.length} newly blanked column${fresh.length === 1 ? ' was' : 's were'} added to the never-import list.` : ''}`);
    toast('Import saved. New instruments get prices and logos at the next price refresh.');
  } catch (e) { writeFailed(e); status("The import wasn't saved."); }
}

/* ---------- data wiring ---------- */
function subscribe() {
  const db = S.db;
  const timer = setTimeout(() => { if (!(S.loaded.imports && S.loaded.market && S.loaded.instruments)) { S.timedOut = true; scheduleRender(); } }, 10000);
  const done = k => { S.loaded[k] = true; if (S.loaded.imports && S.loaded.market && S.loaded.instruments) { clearTimeout(timer); S.timedOut = false; } };
  const onErr = k => e => { done(k); if (e && e.code !== 'revoked') toast("Part of your portfolio data couldn't be loaded. Reload the page to try again."); scheduleRender(); };
  db.collection('imports').onSnapshot(snap => { S.imports = snap.docs.map(d => Object.assign({ __id: d.id }, d.data())); S.dirty = true; if (!snap.metadata.fromCache || snap.size) done('imports'); scheduleRender(); }, onErr('imports'));
  db.collection('instruments').onSnapshot(snap => { const o = {}; for (const d of snap.docs) { const x = d.data(); if (x && x.saxo) o[x.saxo] = x; } S.instruments = o; S.dirty = true; if (!snap.metadata.fromCache || snap.size) done('instruments'); scheduleRender(); }, onErr('instruments'));
  db.collection('market').onSnapshot(snap => { const o = {}; for (const d of snap.docs) { const x = d.data(); if (x && x.symbol) o[x.symbol] = x; } S.market = o; S.dirty = true; if (!snap.metadata.fromCache || snap.size) done('market'); scheduleRender(); }, onErr('market'));
  db.collection('edits').onSnapshot(snap => { const o = {}; for (const d of snap.docs) { const x = d.data(); if (x) o[d.id] = x; } S.edits = o; S.dirty = true; scheduleRender(); }, () => {});
  db.doc('settings/benchmarks').onSnapshot(s => { if (s.exists) S.bench = s.data(); scheduleRender(); }, () => {});
  db.doc('settings/strategies').onSnapshot(s => { S.strategies = s.exists ? (s.data().map || {}) : {}; S.dirty = true; scheduleRender(); }, () => {});
  db.doc('settings/columns').onSnapshot(s => { S.columns = s.exists ? s.data() : null; scheduleRender(); }, () => {});
  db.doc('settings/catalog').onSnapshot(s => { S.catalog = s.exists ? (s.data().items || []) : []; scheduleRender(); }, () => {});
  db.doc('meta/refresh').onSnapshot(s => { S.meta = s.exists ? s.data() : null; S.dirty = true; scheduleRender(); }, () => {});
  db.collection('requests').onSnapshot(snap => { S.requests = snap.docs.map(d => Object.assign({ __id: d.id }, d.data())); scheduleRender(); }, () => {});
}
let lastW = 0;
new ResizeObserver(entries => { const w = Math.round(entries[0].contentRect.width); if (Math.abs(w - lastW) > 30) { lastW = w; if (S.model) scheduleRender(); } }).observe($('#main'));

readRoute(); render();
(async () => {
  let db = null; try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch {}
  if (!db) { S.loaded.nodb = true; render(); return; }
  S.db = db; subscribe();
  try { const u = window.claude && await window.claude.use('user'); if (u) { const can = await u.can('data.write'); if (can === false) { S.readOnly = true; scheduleRender(); } } } catch {}
})();
})();

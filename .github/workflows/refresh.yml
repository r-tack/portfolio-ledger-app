# Builds the standalone web app, refreshes the prices, and publishes both to GitHub Pages.
# Runs every day around 6:53 Belgian time, when you push to main, and when you press "Run workflow".
#
# Needs, in the repository settings:
#   Pages > Source: GitHub Actions
#   Secrets and variables > Actions > secrets LEDGER_PASSPHRASE and LEDGER_REFRESH_LIST
# Without the two secrets the app is still published, without prices.
name: Daily price refresh

on:
  schedule:
    # GitHub schedules are in UTC, and GitHub starts them late when it is busy (sometimes hours),
    # or skips one now and then. So there are two lines: 4:53 and 5:53 UTC. One of them is 6:53
    # in Belgium whatever the season (5:53 UTC in winter, 4:53 UTC in summer); the other runs
    # an hour earlier or later. Running twice is harmless: each run replaces the prices file.
    - cron: '53 4 * * *'
    - cron: '53 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build the app
        run: python3 app/build.py _site
      - name: Fetch the previous prices file
        env:
          BASE: ${{ steps.pages.outputs.base_url }}
        run: curl -fsSL --retry 2 "$BASE/prices.json.enc" -o _site/prices.json.enc || rm -f _site/prices.json.enc
      - name: Refresh prices
        id: refresh
        continue-on-error: true
        env:
          LEDGER_PASSPHRASE: ${{ secrets.LEDGER_PASSPHRASE }}
          LEDGER_REFRESH_LIST: ${{ secrets.LEDGER_REFRESH_LIST }}
        run: |
          if [ -z "$LEDGER_PASSPHRASE" ] || [ -z "$LEDGER_REFRESH_LIST" ]; then
            echo "The secrets LEDGER_PASSPHRASE and LEDGER_REFRESH_LIST are not both set: publishing the app without new prices."
            exit 0
          fi
          pip install --quiet cryptography pillow
          python3 refresh/standalone.py _site/prices.json.enc prices.new
          mv prices.new _site/prices.json.enc
      - name: Keep a failed run's file (previous prices plus the error)
        if: steps.refresh.outcome == 'failure'
        run: if [ -s prices.new ]; then mv prices.new _site/prices.json.enc; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Report a failed refresh
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "The price refresh failed; the app was published with the previous prices."
          exit 1
